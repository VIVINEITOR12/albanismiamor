<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLORES</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap');

        /* Estilos básicos integrados para asegurar compatibilidad móvil */
        *, *::after, *::before {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        :root {
            --color-bg: #050505;
            --color-glass: rgba(255, 255, 255, 0.05);
            --color-space: #000;
        }
        body {
            background-color: var(--color-bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
        }
        .header-text {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffcc00;
            font-size: 15px;
            text-align: center;
            width: 90%;
            max-width: 600px;
            z-index: 10;
            font-weight: 800;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            letter-spacing: 1px;
            animation: bounce 1s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateX(-50%); }
            40% { transform: translate(-50%, -8px); }
            60% { transform: translate(-50%, -4px); }
        }
        .flowers {
            position: relative;
            transform: scale(0.9);
        }
        /* Estilos generales de las flores */
        .flower {
            position: absolute;
            bottom: 10vmin;
            left: 50%;
            transform-origin: bottom center;
            z-index: 10;
        }
        .flower--1 { animation: moving-flower-1 4s linear infinite; }
        .flower--2 { left: 30%; bottom: 3vmin; transform: scale(0.7); animation: moving-flower-2 4s linear infinite; }
        .flower--3 { left: 70%; bottom: 3vmin; transform: scale(0.6); animation: moving-flower-3 4s linear infinite; }
        
        .flower__line {
            width: 2vmin;
            height: 56vmin;
            background-image: linear-gradient(to left, rgba(0,0,0,0.2), transparent, rgba(255,255,255,0.2)), linear-gradient(to top, transparent 10%, #14757e, #readonly);
            box-shadow: inset 0 0 2px rgba(0,0,0,0.5);
            border-radius: 4px;
        }
        .flower__leafs {
            position: relative;
            animation: blooming-flower 2s backwards;
        }
        .flower__white-circle {
            position: absolute;
            width: 8vmin;
            height: 8vmin;
            background: #fff;
            border-radius: 50%;
            top: -3vmin;
            left: -3vmin;
        }
        .night {
            position: fixed;
            left: 0; top: 0; width: 100%; height: 100%;
            background-image: radial-gradient(ellipse at top, transparent 0%, var(--color-space)), radial-gradient(ellipse at bottom, var(--color-bg), var(--color-space));
            z-index: 1;
        }
    </style>
</head>
<body>
    <h1 class="header-text">Flores amarillas para ti Albanis. No son físicas porque las cosas buenas se hacen esperar, pero la intención y el buen gusto de acordarme de ti no te los quita nadie. Acepta el detalle y déjate querer jajaja!</h1>
    <div class="night"></div>
    <div class="flowers">
      <div class="flower flower--1">
        <div class="flower__leafs flower__leafs--1">
          <div class="flower__white-circle"></div>
        </div>
        <div class="flower__line"></div>
      </div>
      <div class="flower flower--2">
        <div class="flower__leafs flower__leafs--2">
          <div class="flower__white-circle"></div>
        </div>
        <div class="flower__line"></div>
      </div>
      <div class="flower flower--3">
        <div class="flower__leafs flower__leafs--3">
          <div class="flower__white-circle"></div>
        </div>
        <div class="flower__line"></div>
      </div>
    </div>
</body>
</html>
