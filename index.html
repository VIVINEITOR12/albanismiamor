<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLORES</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap');

        *, *::after, *::before {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        :root {
            --color-bg: #050505;
            --color-glass: rgba(255, 255, 255, 0.05);
            --color-space: #000;
        }

        body {
            background-color: var(--color-bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
        }

        .header-text {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffcc00;
            font-size: 15px;
            text-align: center;
            width: 90%;
            max-width: 500px;
            z-index: 10;
            font-weight: 800;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
            letter-spacing: 1px;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateX(-50%); }
            40% { transform: translate(-50%, -8px); }
            60% { transform: translate(-50%, -4px); }
        }

        .night {
            position: fixed;
            left: 0; top: 0; width: 100%; height: 100%;
            background-image: radial-gradient(ellipse at top, transparent 0%, var(--color-space)), radial-gradient(ellipse at bottom, var(--color-bg), var(--color-space));
            z-index: 1;
        }

        .flowers {
            position: relative;
            transform: scale(0.9);
        }

        .flower {
            position: absolute;
            bottom: 10vmin;
            left: 50%;
            transform-origin: bottom center;
            z-index: 10;
            animation: moving-flower 4s linear infinite;
        }

        .flower--1 {
            animation: moving-flower-1 4s linear infinite;
        }

        .flower--2 {
            left: 32%;
            bottom: 3vmin;
            transform: scale(0.7) rotate(20deg);
            animation: moving-flower-2 4s linear infinite;
        }

        .flower--3 {
            left: 68%;
            bottom: 3vmin;
            transform: scale(0.6) rotate(-20deg);
            animation: moving-flower-3 4s linear infinite;
        }

        .flower__line {
            width: 2vmin;
            height: 56vmin;
            background-image: linear-gradient(to left, rgba(0,0,0,0.2), transparent, rgba(255,255,255,0.2)), linear-gradient(to top, transparent 10%, #14757e, #070707);
            box-shadow: inset 0 0 2px rgba(0,0,0,0.5);
            border-radius: 4px;
        }

        .flower__leafs {
            position: relative;
            animation: blooming-flower 2s backwards;
        }

        .flower__leafs--1 { animation-delay: 1s; }
        .flower__leafs--2 { animation-delay: 1.4s; }
        .flower__leafs--3 { animation-delay: 1.8s; }

        .flower__white-circle {
            position: absolute;
            width: 8vmin;
            height: 8vmin;
            background: #ffbb00;
            border-radius: 50%;
            top: -4vmin;
            left: -4vmin;
            box-shadow: 0 0 15px #ffcc00;
        }

        .flower__leaf {
            position: absolute;
            bottom: 0; left: 50%;
            width: 8vmin;
            height: 11vmin;
            border-radius: 51% 49% 47% 53% / 34% 44% 56% 66%;
            background-color: #fffa65;
            background-image: linear-gradient(to top, #ffcc00, #fffa65);
            transform-origin: bottom center;
            opacity: 0.9;
            box-shadow: inset 0 0 2px rgba(255, 255, 255, 0.5);
        }

        .flower__leaf--1 { transform: translate(-10%, 1%) rotateY(40deg) rotate(-50deg); }
        .flower__leaf--2 { transform: translate(-50%, -4%) rotateY(40deg) rotate(0deg); }
        .flower__leaf--3 { transform: translate(-90%, 0%) rotateY(40deg) rotate(50deg); }
        .flower__leaf--4 { width: 8vmin; height: 8vmin; transform-origin: bottom left; border-radius: 4vmin 10vmin 4vmin 4vmin; transform: translate(0, 18%) rotateX(70deg) rotate(-43deg); background-image: linear-gradient(to top, #febc00, #fffa65); z-index: 1; opacity: 0.8; }

        @keyframes blooming-flower {
            0% { transform: scale(0); }
        }

        @keyframes moving-flower-1 {
            0%, 100% { transform: rotate(2deg); }
            50% { transform: rotate(-2deg); }
        }
        @keyframes moving-flower-2 {
            0%, 100% { transform: scale(0.7) rotate(18deg); }
            50% { transform: scale(0.7) rotate(22deg); }
        }
        @keyframes moving-flower-3 {
            0%, 100% { transform: scale(0.6) rotate(-18deg); }
            50% { transform: scale(0.6) rotate(-22deg); }
        }
    </style>
</head>
<body>
    <h1 class="header-text">Flores amarillas para ti Albanis. No son físicas porque las cosas buenas se hacen esperar, pero la intención y el buen gusto de acordarme de ti no te los quita nadie. Acepta el detalle y déjate querer jajaja!</h1>
    <div class="night"></div>
    <div class="flowers">
      <div class="flower flower--1">
        <div class="flower__leafs flower__leafs--1">
          <div class="flower__white-circle"></div>
          <div class="flower__leaf flower__leaf--1"></div>
          <div class="flower__leaf flower__leaf--2"></div>
          <div class="flower__leaf flower__leaf--3"></div>
          <div class="flower__leaf flower__leaf--4"></div>
        </div>
        <div class="flower__line"></div>
      </div>
      <div class="flower flower--2">
        <div class="flower__leafs flower__leafs--2">
          <div class="flower__white-circle"></div>
          <div class="flower__leaf flower__leaf--1"></div>
          <div class="flower__leaf flower__leaf--2"></div>
          <div class="flower__leaf flower__leaf--3"></div>
          <div class="flower__leaf flower__leaf--4"></div>
        </div>
        <div class="flower__line"></div>
      </div>
      <div class="flower flower--3">
        <div class="flower__leafs flower__leafs--3">
          <div class="flower__white-circle"></div>
          <div class="flower__leaf flower__leaf--1"></div>
          <div class="flower__leaf flower__leaf--2"></div>
          <div class="flower__leaf flower__leaf--3"></div>
          <div class="flower__leaf flower__leaf--4"></div>
        </div>
        <div class="flower__line"></div>
      </div>
    </div>
</body>
</html>
